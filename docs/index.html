<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- tailwind -->

    <link rel="preload" href="/static/css/style.css" as="style" onload="this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="/static/css/style.css">
    </noscript>

    <!-- gsap -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrambleTextPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <title>Document</title>

    <style>
    #loading-screen {
        background-color: oklch(13% 0.028 261.692);
        color: white;
        position: fixed;
        width: 100vw;
        height: 100vh;
        z-index: 1000;
    }

    #loading-screen-bg {
        position: absolute;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        filter: blur(3px) brightness(50%);
    }

    #loading-screen-riin {
        font-weight: 800;
        font-size: 3rem;
    }

    #loading-screen-cont {
        position: absolute;
        display: flex;
        width: 100vw;
        height: 100vh;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    #loading-screen-loader {
        width: 80px;
        margin-bottom: 2rem;
        aspect-ratio: 2;
        --c: no-repeat linear-gradient(white 0 0);
        background: var(--c), var(--c), var(--c), var(--c), var(--c), var(--c), var(--c);
        animation:
            l4-1 1.9s infinite,
            l4-2 1.9s infinite;
    }

    @keyframes l4-1 {
        0% {
            background-size: 0 4px, 4px 0, 0 4px, 4px 0, 0 4px, 4px 0, 0 4px
        }

        7.14% {
            background-size: 25% 4px, 4px 0, 0 4px, 4px 0, 0 4px, 4px 0, 0 4px
        }

        14.29% {
            background-size: 25% 4px, 4px 50%, 0 4px, 4px 0, 0 4px, 4px 0, 0 4px
        }

        21.43% {
            background-size: 25% 4px, 4px 50%, 25% 4px, 4px 0, 0 4px, 4px 0, 0 4px
        }

        28.57% {
            background-size: 25% 4px, 4px 50%, 25% 4px, 4px 100%, 0 4px, 4px 0, 0 4px
        }

        35.71% {
            background-size: 25% 4px, 4px 50%, 25% 4px, 4px 100%, 25% 4px, 4px 0, 0 4px
        }

        42.86% {
            background-size: 25% 4px, 4px 50%, 25% 4px, 4px 100%, 25% 4px, 4px 50%, 0 4px
        }

        49%,
        51% {
            background-size: 25% 4px, 4px 50%, 25% 4px, 4px 100%, 25% 4px, 4px 50%, 25% 4px
        }

        57.14% {
            background-size: 0 4px, 4px 50%, 25% 4px, 4px 100%, 25% 4px, 4px 50%, 25% 4px
        }

        64.29% {
            background-size: 0 4px, 4px 0, 25% 4px, 4px 100%, 25% 4px, 4px 50%, 25% 4px
        }

        71.43% {
            background-size: 0 4px, 4px 0, 0 4px, 4px 100%, 25% 4px, 4px 50%, 25% 4px
        }

        78.57% {
            background-size: 0 4px, 4px 0, 0 4px, 4px 0, 25% 4px, 4px 50%, 25% 4px
        }

        85.71% {
            background-size: 0 4px, 4px 0, 0 4px, 4px 0, 0 4px, 4px 50%, 25% 4px
        }

        92.86% {
            background-size: 0 4px, 4px 0, 0 4px, 4px 0, 0 4px, 4px 0, 25% 4px
        }

        100% {
            background-size: 0 4px, 4px 0, 0 4px, 4px 0, 0 4px, 4px 0, 0 4px
        }
    }

    @keyframes l4-2 {

        0%,
        49.9% {
            background-position: 0 50%, bottom 20px left 16px, 20px 0, 50% 0, 40px 100%, bottom 0 right 16px, 60px 50%
        }

        50%,
        100% {
            background-position: right 60px top 50%, 16px 0, right 40px top 0, 50% 100%, right 20px bottom 0, right 16px top 20px, 100% 50%
        }
    }

    .preload-script {
        mix-blend-mode: darken;
        width: 4px;
        height: 4px;
        opacity: 100%;
    }
</style>
</head>

<body class="bg-gray-950 text-white relative">
    <div id="loading-screen">
        <img id="loading-screen-bg" src="/static/img/base-empty-normal-LQ.png" alt="">
        <div id="loading-screen-cont" class="">
            <p id="loading-screen-riin">RiiN</p>
            <div id="loading-screen-loader"></div>
            <p>Cargando...</p>
        </div>
    </div>
    <header class="fixed z-50">
        <div id="header-bar">
            <!-- <p>HEADER</p> -->
        </div>
        <div id="header-menu">

        </div>
    </header>
    <div id="hero-background" class="absolute w-screen h-screen -z-50 select-none">
        <img id="hero-base-empty-normal" class="absolute size-full object-cover preload-script z-0"
            src="/static/img/base-empty-normal.png" alt="">
        <img id="hero-base-shadow-difference" class="absolute size-full object-cover preload-script z-1"
            src="/static/img/base-shadow-difference.png" alt="" style="mix-blend-mode: difference;">
        <img id="hero-text-cut-normal" class="absolute w-screen h-screen object-cover preload-script z-2"
            src="/static/img/text-cut-normal.png" alt="">
        <img id="hero-light1" class="absolute size-full object-cover preload-script z-3 hero-light"
            src="/static/img/base-full-light1-difference.png" alt="">
        <img id="hero-light2" class="absolute size-full object-cover preload-script z-4 hero-light"
            src="/static/img/base-full-light2-difference.png" alt="">
        <img id="hero-light3" class="absolute size-full object-cover preload-script z-5 hero-light"
            src="/static/img/base-full-light3-difference.png" alt="">
    </div>
    <section id="hero" class="relative w-screen h-screen px-2 md:px-8 grid grid-rows-[2fr_3fr_2fr_1fr]">
        <div class="row-start-2 flex flex-col">
            <p id="hero-main-title-over" class="text-xl md:text-3xl">Consultora de</p>
            <h1 id="hero-main-title" class="text-3xl md:text-7xl lg:text-8xl uppercase font-bold"></h1>
        </div>
        <div class="row-start-3 flex flex-col justify-end">
            <p id="hero-main-paragraph" class="text-xl md:text-3xl max-w-72 md:max-w-md">Hacemos que la tecnología trabaje para vos</p>
        </div>
    </section>
    <div class="h-screen"></div>
    <div class="h-screen"></div>
    <script src="/static/js/animations.js"></script>

</body>

</html>
